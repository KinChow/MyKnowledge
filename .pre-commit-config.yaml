# 提交前门禁。做法对齐 pydantic / fastapi / astral-sh/ruff 三个仓库的通行结构：
# 1) pre-commit-hooks 做文件级卫生检查；2) ruff 做 lint + format；3) local 钩子做
# 仓库特有的复发防护；4) 慢检查（pytest）放 pre-push，不拖慢每次提交。
# rev 全部固定，升级由人显式执行 `pre-commit autoupdate`。

# 内容与证据目录对任何"自动改写"钩子都是禁区：archive/ 的文件名就是正文
# sha256，content/sources 与 content/wiki 的 content_sha256 进 evidence 与确认
# 事件——改一个行尾空白就会让全链 hash 失配。（2026-08-28 实测：
# trailing-whitespace 与 end-of-file-fixer 一次改写了 197 个快照 + 149 个 source
# + 236 篇文档。）路径必须与 tools/paths.py 的 §4.6 布局同步：批次 1/2 之后
# 旧前缀（sources/、wiki/、queries/…）已不存在，写着旧前缀等于这层保护为空。
exclude: |
  (?x)^(
    archive/.*|
    audit/.*|
    release/.*|
    ledger/.*|
    content/.*|
    var/.*|
    docs/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5 # 与 requirements-dev.txt 保持同版本
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # 复发防护：CI 曾因 lockfile 的 resolved URL 指向内网镜像而全部失败
      # （GitHub runner 不可达），同时内网主机名不应出现在公开仓库。
      - id: npm-lock-public-registry
        name: npm lockfile must resolve to the public registry
        entry: scripts/check-npm-lock-registry.sh
        language: script
        files: ^frontend/package-lock\.json$
        pass_filenames: false

      # 唯一权威的内容完整性门禁（0.4s）：archive 快照必须自证（文件名 ==
      # 正文 sha256）、sources front-matter 与快照一致。exclude 是黑名单、永远
      # 落后于工具演进；这条是白名单式因果闭环——不管是谁改写了内容，提交前必失败。
      # 它自己抓到过 `ruff format` 改写 Markdown 代码块（2026-08-28）。
      # 解释器写死 .venv/bin/python：钩子在裸 shell 下由 git 触发，PATH 里可能
      # 既没有 `python` 也没有项目依赖（scripts/bootstrap.sh 保证 .venv 存在）。
      # 追踪矩阵完成度列机器派生（matrix sync）：人只维护状态列/测试列，
      # 完成度由 tools/matrix_sync.py 按「状态 × 引用文件存在性」派生。
      # 本钩子作为生成器：检测到完成度需更新时改写矩阵并返回 1（阻止本次
      # 提交，要求重新 git add 后再提交）——即"每次提交生成 matrix"。
      - id: matrix-sync
        name: traceability matrix completion sync
        entry: .venv/bin/python -m tools.cli matrix sync
        language: system
        pass_filenames: false
        always_run: true

      - id: doctor
        name: doctor content integrity (hash chain)
        entry: .venv/bin/python -m tools.cli doctor --assert-clean
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (pre-push)
        entry: scripts/run-pre-push-tests.sh
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
