name: Knowledge site check

# GitHub Actions 不支持 YAML anchor，两处 paths 只能显式重复
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'config/**'
      - 'skills/**'
      - 'tools/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'queries/public/**'
      - 'release/public-confirmations/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.pre-commit-config.yaml'
      - '.github/workflows/knowledge-check.yml'
  push:
    paths:
      - 'docs/**'
      - 'config/**'
      - 'skills/**'
      - 'tools/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'queries/public/**'
      - 'release/public-confirmations/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - '.pre-commit-config.yaml'
      - '.github/workflows/knowledge-check.yml'

jobs:
  # 全部业务逻辑在 Python 侧，CI 必须覆盖它：格式/lint 与本地 pre-commit 同配置同版本。
  # 双版本矩阵：3.12 是 bootstrap.sh 声明的下限，3.14 是当前开发环境——
  # 只测一个版本时，3.14-only 语法（如 PEP 758 无括号 except）会静默漏过。
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: python -m pytest -q
      # 内容完整性与本地 pre-commit 同一条命令：archive 快照 hash 自证。
      # 只在 3.12 跑一次即可——检查的是仓库内容，与解释器版本无关。
      - if: matrix.python-version == '3.12'
        run: python -m tools.cli doctor --assert-clean

  # 前端只有校验脚本（无发布），config/docs 常驻；projection 仅在 manifest 存在时校验
  frontend-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run validate:config
      - run: npm run validate:docs
      - name: Detect public projection manifest
        id: projection
        shell: bash
        run: |
          if [[ -f ../queries/public/manifest.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No queries/public/manifest.json; projection validation is deferred until migration creates it."
          fi
      - name: Validate public projection and release gates
        if: steps.projection.outputs.present == 'true'
        run: npm run validate:projection
