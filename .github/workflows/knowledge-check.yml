name: Knowledge site check

# GitHub Actions 不支持 YAML anchor，两处 paths 只能显式重复
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'config/**'
      - 'skills/**'
      - 'tools/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'var/queries/public/**'
      - 'release/public-confirmations/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-browser.txt'
      - 'requirements-release.txt'
      - '.gitattributes'
      - 'content/wiki/**'
      - 'content/sources/**'
      - 'archive/**'
      - 'audit/retire/**'
      - 'audit/validation/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/**'
  push:
    paths:
      - 'docs/**'
      - 'config/**'
      - 'skills/**'
      - 'tools/**'
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'scripts/**'
      - 'var/queries/public/**'
      - 'release/public-confirmations/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-browser.txt'
      - 'requirements-release.txt'
      - '.gitattributes'
      - 'content/wiki/**'
      - 'content/sources/**'
      - 'archive/**'
      - 'audit/retire/**'
      - 'audit/validation/**'
      - '.pre-commit-config.yaml'
      - '.github/workflows/**'

jobs:
  # 全部业务逻辑在 Python 侧，CI 必须覆盖它：格式/lint 与本地 pre-commit 同配置同版本。
  # 双版本矩阵：3.12 是 bootstrap.sh 声明的下限，3.14 是当前开发环境——
  # 只测一个版本时，3.14-only 语法（如 PEP 758 无括号 except）会静默漏过。
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      # 官方资料 PDF 走 Git LFS（见 .gitattributes: /content/sources/**/*.pdf）。
      # 默认 lfs:false 时工作区只有指针文件，其 sha256 与 SHA256SUMS 记录的真实
      # 文件哈希不符 → “Verify pinned official course materials”必失败。
      # 只有 3.12 leg 跑该校验，故仅在 3.12 拉取 LFS，避免 3.14 leg 多余带宽。
      - uses: actions/checkout@v4
        with:
          lfs: ${{ matrix.python-version == '3.12' }}
      - if: matrix.python-version == '3.12'
        name: Materialize Git LFS files
        run: git lfs checkout
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # 3.14 leg：marker-pdf 锁 pillow<11，而 Pillow 10.x 早于 Python 3.14，
      # 无 cp314 wheel（也无 abi3 wheel）→ 只能从源码构建 Pillow。
      # 本机已实测 Pillow 10.4.0 在 3.14 可编译；补构建依赖（zlib/jpeg/tiff 头文件）
      # 后 Linux 同样可构建。3.12 leg 有 cp312 wheel，无需源码构建。
      - if: matrix.python-version == '3.14'
        name: Install Pillow source build dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libjpeg-dev libtiff-dev
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Git LFS pointers
        run: python -m tools.git_lfs
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: python -m pytest -q
      # 内容完整性与本地 pre-commit 同一条命令：archive 快照 hash 自证。
      # 只在 3.12 跑一次即可——检查的是仓库内容，与解释器版本无关。
      - if: matrix.python-version == '3.12'
        run: python -m tools.cli doctor --assert-clean
      # 官方课程资料按 pinned commit 原样归档，不参与项目代码格式化；
      # SHA256SUMS 是它们的独立完整性门禁。
      - if: matrix.python-version == '3.12'
        name: Verify pinned official course materials
        working-directory: content/sources/computer-science/cs336-2026/official-materials
        run: sha256sum -c SHA256SUMS

  # Same real release + browser checks as local pre-push; practice uses disposable data.
  frontend-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Materialize fetched LFS objects before the release-input cleanliness
      # guard runs. This keeps the guard strict while avoiding pointer-file
      # worktree changes on GitHub-hosted runners.
      - name: Materialize Git LFS files
        working-directory: ${{ github.workspace }}
        run: git lfs checkout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ../requirements-browser.txt
      - name: Verify Git LFS pointers
        working-directory: ${{ github.workspace }}
        run: python -m tools.git_lfs
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:config
      - run: npm run validate:docs
      - name: Detect public projection manifest
        id: projection
        shell: bash
        run: |
          if [[ -f ../var/queries/public/manifest.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No var/queries/public/manifest.json; projection validation is deferred until migration creates it."
          fi
      - name: Validate public projection and release gates
        if: steps.projection.outputs.present == 'true'
        run: npm run validate:projection
      - name: Build committed release and run public + local browser tests
        env:
          PUBLIC_BASE_PATH: /MyKnowledge/
        run: npm run check:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
