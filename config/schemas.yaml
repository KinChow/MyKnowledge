schema_version: 1

# 路径契约与字段清单（ADR-0019 收窄）。本文件只保留**有代码读取方**的两类键：
# (1) 路径契约——field_contracts.*_path / durable_records / backup /
#     public_release_authority，由 tools/path_contract.py 与 tools/paths.py 的
#     派生值对账（声明≠派生即 doctor red）；
# (2) 字段清单——field_contracts.wiki / public_projection / hash_inputs，由
#     validator 与 release_input 消费。
# 对象/事件的完整契约由运行时强制，不在此声明：wiki 见 config/json-schema/
# wiki-v1.json（jsonschema），source 见 tools/ingest/source_validator.py，
# API 见 backend/schemas.py（Pydantic）。无读取方的"设计说明"不进本文件。
field_contracts:
  wiki:
    schema_version: wiki/v1
    required_fields:
      - id
      - title
      - domain
      - kind
      - status
      - publication_scope
      - confidentiality
      - tags
      - aliases
      - related
      - sources
      - evidence
      - updated_at
    allowed_fields:
      - id
      - title
      - domain
      - kind
      - status
      - publication_scope
      - confidentiality
      - tags
      - aliases
      - related
      - part_of
      - sources
      - evidence
      - updated_at
      - review_by
  capability_token:
    schema_version: capability-token/v1
    required_fields: []
    allowed_fields: []
    storage_path: var/state/capability-token
    parent_directory: var/state
    file_mode: '0600'
    parent_directory_mode: '0700'
    random_bytes: 32
    rotate_on_process_start: true
    no_http_retrieval_endpoint: true
    transport: [protected-process-environment, inherited-file-descriptor]
    forbidden_locations: [url, query_string, cookie, browser-storage, repository, log]
    comparison: constant-time
    audience: myknowledge-local-api
    scopes: [public-read, local-read, private-read, vault-check, write]
    missing_error: capability_token_required
    invalid_error: capability_token_invalid
  backup_manifest:
    schema_version: backup-manifest/v1
    required_fields:
      - schema_version
      - backup_id
      - vault_id
      - generated_at
      - source_revision
      - target_kind
      - entries
      - lfs_objects
      - audit_chain_heads
      - manifest_sha256
    durable_path: audit/backup/<backup_id>.json
    target_kinds: [private_git_remote, encrypted_backup_target, combined]
    key_material_policy: opaque-key-reference-only
    allowed_fields:
      - schema_version
      - backup_id
      - vault_id
      - generated_at
      - source_revision
      - target_kind
      - target_identity_opaque
      - encryption
      - entries
      - lfs_objects
      - audit_chain_heads
      - tool_version
      - manifest_sha256

public_projection:
  allowed_manifest_fields:
    - schema_version
    - projection
    - generated_from
    - generated_at
    - generatedAt
    - policy_version
    - manifest_sha256
    - generator_version
    - source_revision
    - approval
    - items
  required_item_fields:
    - id
    - object_type
    - vault_id
    - title
    - domain
    - kind
    - tags
    - strength
    - route
    - body_path
    - attachments
    - status
    - publication_scope
    - public_publishable
    - public_release
    - effective_confidentiality
    - validation_state
    - evidence_state
    - links
    - content_sha256
    - evidence_sha256
  allowed_vault_id: public
  allowed_object_type: wiki
  body_hash_must_match: true
  # Approval is the committed source_revision; historical confirmations are not inputs.
  public_metadata_fields:
    - id
    - title
    - domain
    - kind
    - status
    - publication_scope
    - effective_confidentiality
    - validation_state
    - evidence_state
    - strength
    - content_sha256
    - evidence_sha256
  manifest_hash_volatile_fields:
    - generated_at
    - generatedAt
    - manifest_sha256
  leak_gate_report_scopes: [input-item, input-tree, dist]
  input_leak_gate_schema_version: public-input-leak-gate/v1
  dist_leak_gate_schema_version: public-leak-gate/v1

validation:
  # ADR-0019：审计契约（verdict/ruleset/corroboration/coverage/report_conflict/
  # not_run/override 字段清单等）的权威在 tools/validation/*.py（hardcode 强制）
  # + F003 acceptance + ADR-0010。此处曾有一份无读者的字段级副本，已随 config
  # 死声明清理删除（它在漂——§5 的 selector_sha256 矛盾即出在其 evidence_form）。
  # 仅保留 override.durable_path：path_contract 读它做路径对账。
  override:
    schema_version: validation-override/v1
    durable_path: audit/validation/wiki/<object_id>/overrides/<record_sha256>.json
public_release_authority:
  field: public_release
  default: false
  frontmatter_direct_write: forbidden
  materialized_projection_only: true
  historical_records:
    confirmation_event: release/public-confirmations/<event_id>.json
    target_operation: audit/operations/<operation_id>.json
    source_lineage_operation: source-owner-vault/audit/operations/<operation_id>.json
  # Historical record paths above are retained for backup/path compatibility only.
  approval_boundary: current_git_commit
  historical_record_behavior: retain_and_validate_only
  llm_audit: advisory

hash_inputs:
  source_semantic:
    - vault_id
    - origin
    - source_type
    - read_status
    - evidence_status
    - confidentiality
    - retrieval.acquisition
    - retrieval.snapshot_sha256
    - retrieval.extractor_name
    - retrieval.extractor_version
    - retrieval.extractor_options_hash
    - retrieval.normalization_version
    - local.file_sha256
  wiki_semantic:
    - vault_id
    - kind
    - confidentiality
    - sources
  wiki_evidence:
    - owner_vault_id
    - evidence.claim_id
    - evidence.claim
    - evidence.targets
    - evidence.targets.resolved_object_ref
    - evidence.support
    - evidence.supporting_quotes
  excluded_from_content_hash:
    - title
    - domain
    - tags
    - aliases
    - related
    - status
    - updated_at
    - review_by
    - validation_state
    - public_release
    - public_confirmation_sha256

backup:
  states: [unconfigured, configured, verified, failed]
  target_kinds: [private_git_remote, encrypted_backup_target]
  state_machine:
    unconfigured:
      enter_when: no_backup_target_is_configured
      allows: [read, reversible_edit]
      blocks: [purge, destructive_restore, overwrite_restore]
    configured:
      enter_when: at_least_one_target_configured_and_credentials_resolve
      reset_on: [target_identity_change, verification_expired]
      next_states: [verified, failed, unconfigured]
    verified:
      enter_when: all_configured_targets_pass_integrity_and_empty_restore
      requires_fresh_manifest: true
      next_states: [failed, configured, unconfigured]
    failed:
      enter_when: [backup_upload_failed, integrity_failed, restore_failed, audit_chain_failed, target_unreachable]
      next_states: [configured, verified, unconfigured]
  durable_manifest_path: audit/backup/<backup_id>.json
  verification_expiry_seconds: 2592000
  durable_record_required: true
  target_change_requires_reverification: true
  shared_blob_cache_is_not_backup: true
  verified_requires:
    - backup_manifest_hash
    - backup_integrity_check
    - isolated_empty_checkout_restore
    - restored_owner_hash_set_match

durable_records:
  operation_path: audit/operations/<operation_id>.json
  validation_path: audit/validation/<object_type>/<object_id>/<attestation_sha256>.json
  public_confirmation_path: release/public-confirmations/<event_id>.json
  backup_manifest_path: audit/backup/<backup_id>.json
  temporary_state_is_not_authoritative: true
