schema_version: 1
policy_version: policy-v1

paths:
  workspace_root: null             # resolved by Vault Registry; see vault manifest layout rules
  local_source_sidecar: var/state/local-sources
  local_source_sidecar_file_mode: '0600'
  local_source_sidecar_dir_mode: '0700'
  allowed_local_file_roots: []       # empty means the caller must provide an explicit, readable path
  reject_symlink_escape: true
  reject_hardlink_escape: true

layers:                              # §4.4–§4.5：三个数据域与五层归属
  vault_content_roots:               # 有 object 身份、per-vault
    - content/sources/
    - content/wiki/
  vault_store_roots:                 # append-only（批次 3 迁入 ledger/ 后同步更新）
    - archive/
    - audit/
    - release/
  derived_roots:                     # 可重建，删除后用命令重新生成
    - var/queries/
    - var/state/
    - var/reports/
  unmanaged_paths:                   # 无 object 身份、无 schema、无出口
    - content/working/
    - content/journal/
    - content/decisions/
  working:
    # owner 2026-09-01 决策：设为无限。落位后 161 篇长期停在 working 层是**预期
    # 状态**（升级按需、一篇一篇补），按 30 天判滞留会让 doctor 每次输出 161 行
    # 全是预期项的清单，淹没真正需要注意的几篇。恢复筛选力的做法是改判据
    # （只对显式标了 review_by 的篇目催办），不是调大天数。
    ttl_days: unlimited
    ttl_action: report-only          # 工具永不自动删除
  journal:
    path_pattern: content/journal/<YYYY>/<MM>/
    append_only: true
  decisions:
    id_prefix: CDR
    required_on:
      - retire
      - deprecate
      - downgrade

review:                              # §6.2：报告项，不是状态轴
  field: review_by
  required: false

validation:
  schema_version: wiki-validation/v1
  # ADR-0010: optional layer. No capability negotiation; single call; not_run is
  # an observed environment fact, never a model self-declaration.
  optional: true
  blocking_states: [fail]
  publishable_states: [not_run, pass, stale_ruleset]
  samples: 1
  sampling: temperature-zero-single-call
  corroboration_schema_version: corroboration-v1
  corroboration_numeric_default: exact
  corroboration_implicit_numeric_tolerance: false
  corroboration_independence_evidence_fields: [publisher, derived_from, independence_group]
  corroboration_independence_from_domain: forbidden
  context_overflow: not_run
  prompt_compatibility: breaking
  ruleset:
    rule_ref_fields: [doc, section, extract_sha256]
    advisory_participates_in_verdict: false
    change_state: stale_ruleset
    change_invalidates_human_confirmation: false
    # 参与审计的规范条目（spec ID，见 §21 规范 ID 基线）。规则原文不落副本，
    # 运行时按 (doc, section) 从规范文档实时抽取并计算 extract_sha256。
    rule_ids:
      - WIKI-001
      - EVD-001
      - VAL-001
      - VAL-002
      - ARC-002
  coverage_obligations:
    every_claim_times_target_required: true
    advisory_only_counts_as_uncovered: true
    rationale_requires_source_offsets: true
    partial_delivery_accepted: false
  not_run_reasons:
    - provider_unavailable
    - offline
    - context_exceeded
    - malformed_output
    - incomplete_coverage
  model_may_self_declare_not_run: false
  operator_skip_writes_report: false
  data_handling:
    public:
      accepted_confidentiality: [public]
      allowed_retention: [no-persist, bounded]
      training_use: false
    internal:
      accepted_confidentiality: [internal]
      allowed_retention: [no-persist]
      training_use: false
  untrusted_context:
    treat_source_as_data: true
    allow_tools: false
    allow_external_urls: false
    max_reason_chars: 1000
    prompt_boundary: explicit-data-delimiters
    reject_instruction_like_output: false  # output is data; never execute it
security:
  # Built-in loopback/RFC1918/link-local checks are always enabled. These
  # patterns are an additional reviewed allow/deny list and cannot disable
  # the built-ins.
  internal_host_patterns: []
  reject_private_network_targets: true
  fetch:
    allowed_schemes: [http, https]
    reject_userinfo: true
    allowed_ports: [80, 443]
    max_redirects: 5
    timeout_seconds: 30
    max_response_bytes: 10000000
    recheck_redirect_targets: true
    resolve_each_redirect: true
    dns_rebinding_protection: ip-pinning
    connect_to_pinned_ip: true
    preserve_host_header: true
    strip_credentials_from_archive: true
    reject_encoded_private_addresses: true
    max_decompressed_bytes: 10000000
    max_compression_ratio: 100
    reject_invalid_content_encoding: true
    reject_proxy_bypass: true
  local_api:
    bind: 127.0.0.1
    require_write_capability_token: true
    allow_remote_bind: false
    capability_token:
      schema_version: capability-token/v1
      path: var/state/capability-token
      parent_directory: var/state
      file_mode: '0600'
      parent_directory_mode: '0700'
      random_bytes: 32
      rotate_on_process_start: true
      no_http_retrieval_endpoint: true
      transport: [protected-process-environment, inherited-file-descriptor]
      forbidden_locations: [url, query_string, cookie, browser-storage, repository, log]
      comparison: constant-time
      audience: myknowledge-local-api
      required_scopes:
        read_local: local-read
        read_private: private-read
        vault_check: vault-check
        write: write
  public_release_default: false
  public_projection_vault_id: public

release:
  policy_version: policy-v1
  projection_schema_version: public-projection/v1
  require_human_actor: true
  confirmation_event: public-release-confirmation/v1
  private_publish_confirmation_event: operation-confirmation/v1
  private_publish_confirmation_scope: publish_private
  # ADR-0010: the commitment is a sha256 of the lineage record path, not an HMAC.
  # It carries no private vault name or object ID, so no key material is needed.
  lineage_commitment: sha256
  reset_on_hash_change: true
  public_confirmation_path: release/public-confirmations
  durable_audit_path: audit
  public_release_authority:
    field: public_release
    default: false
    frontmatter_direct_write: forbidden
    materialized_projection_only: true
    confirmation_event_path: release/public-confirmations/<event_id>.json
    target_operation_path: audit/operations/<operation_id>.json
    source_lineage_operation_path: source-owner-vault/audit/operations/<operation_id>.json
    required_match_fields:
      - release_input_sha256
      - reviewed_content_sha256
      - reviewed_evidence_sha256
      - leak_gate_report_sha256
      - target_ref
      - operation_id
      - confirmation_nonce
    hash_change_behavior: retain-old-event-but-derive-false
    missing_record_behavior: derive-false-and-block-publish

backup:
  states: [unconfigured, configured, verified, failed]
  target_kinds: [private_git_remote, encrypted_backup_target]
  durable_manifest_path: audit/backup/<backup_id>.json
  key_material_policy: opaque-key-reference-only
  shared_blob_cache_is_not_backup: true
  verification:
    configured_requires: at-least-one-target-and-resolvable-credential-reference
    verified_requires:
      - all_configured_targets_integrity_pass
      - isolated_empty_checkout_restore_pass
      - restored_owner_hash_set_match
      - durable_manifest_record
      - git_history_present
    failure_codes:
      - backup_upload_failed
      - integrity_failed
      - restore_failed
      - target_unreachable
    target_change_requires_reverification: true
    verification_expiry_seconds: 2592000

projection:
  schema_version: public-projection/v1
  manifest_hash_volatile_fields:
    - generated_at
    - generatedAt
    - manifest_sha256
  public_confirmation_path_prefix: release/public-confirmations/
  body_path_prefixes:
    - var/queries/public/
    - content/wiki/
  attachment_path_prefixes:
    - var/queries/public/
    - content/wiki/
  max_attachment_bytes: 10000000
  max_body_bytes: 2000000
  max_route_chars: 512
  max_route_segment_chars: 128
  input_leak_gate_scope: input-tree
  dist_leak_gate_scope: dist
  allowed_attachment_extensions:
    - .avif
    - .csv
    - .gif
    - .jpeg
    - .jpg
    - .pdf
    - .png
    - .txt
    - .webp
  reject_duplicate_routes: true
  reject_unresolved_links: true
  verify_body_hash: true
  verify_confirmation_event: true
  reject_active_content: true
  allowed_frontmatter_fields:
    - title
    - slug
    - description
    - draft
    - pagefind

build:
  # 实测实现路径（frontend/scripts/build-release.mjs:7）。原声明写的
  # `.staging/release.lock` 与实现分叉，属账目虚报，已按实现纠正。
  release_lock_path: var/state/public-release.lock
  warning_policy: blocking-unknown-v1
  # `wx` 独占创建 + finally unlink：残留锁文件会让下一次 build 直接 EEXIST 退出，
  # 因此 stale 即阻断、恢复只能人工删除，两条都是实现的自然结果而非可配项。
  release_lock_stale_action: block
  release_lock_recovery_requires_manual_review: true
  advisory_warning_patterns:
    - 'Some chunks are larger than [0-9]+ kB after minification'
    - 'Entry docs.*404 was not found'
